<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Crawler</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none'><path d='M12 2L14 4L7 11L5 9L12 2Z' fill='%23cbd5e1' stroke='%23334155' stroke-width='0.8'/><line x1='4' y1='12' x2='8' y2='8' stroke='%23f59e0b' stroke-width='1.5'/><line x1='5' y1='11' x2='2' y2='14' stroke='%2378350f' stroke-width='2'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-wrapper">
        <header id="external-bar">
            <span class="app-title">DUNGEON CRAWLER RPG</span>
            <button id="btn-open-settings" class="external-btn">Настройки звука</button>
        </header>

        <div id="game-container">
            <div id="screen-container"></div>
        </div>

        <div id="settings-modal" class="modal-backdrop hidden">
            <div class="modal-window">
                <div class="modal-header">
                    <h3>Настройки звука</h3>
                    <button id="btn-close-settings" class="modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="setting-row">
                        <div class="setting-label-row">
                            <span>Общая громкость</span>
                            <span id="label-master-val">80%</span>
                        </div>
                        <input type="range" id="slider-master" min="0" max="100" value="80">
                    </div>

                    <div class="setting-row">
                        <div class="setting-label-row">
                            <span>Музыка</span>
                            <span id="label-music-val">50%</span>
                        </div>
                        <input type="range" id="slider-music" min="0" max="100" value="50">
                    </div>

                    <div class="setting-row">
                        <div class="setting-label-row">
                            <span>Звуковые эффекты</span>
                            <span id="label-sfx-val">70%</span>
                        </div>
                        <input type="range" id="slider-sfx" min="0" max="100" value="70">
                    </div>

                    <div class="setting-row checkbox-row">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="chk-mute">
                            <span class="checkmark"></span>
                            Отключить весь звук
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
